  <main id="main">
    <section class="portfolio-hero" id="top" aria-labelledby="portfolio-title">
      <p class="eyebrow">01 / AUTOMOTIVE</p>
      <h1 id="portfolio-title">AUTOMOTIVE<br><em>PORTRAITS +<br>SPACES</em></h1>
    </section>

    <section class="portfolio-collection" data-collection aria-label="Automotive Portraits and Spaces">
      <article class="photo-set" data-photo-set aria-labelledby="portraits-title">
        <header class="set-heading" data-reveal><h2 id="portraits-title">PORTRAITS</h2></header>
        <div class="set-gallery">
          <figure class="set-shot" data-reveal>
            <img src="/images/automotive/portrait-porsche-front-1440.jpg" width="1440" height="1800" alt="Silver Porsche 911 photographed from the front inside a private automotive gallery." fetchpriority="high" decoding="async">
          </figure>
          <figure class="set-shot" data-reveal>
            <img src="/images/automotive/portrait-porsche-headlight-1440.jpg" width="1440" height="1800" alt="Close view of a Porsche 911 headlight and fender." loading="lazy" decoding="async">
          </figure>
          <figure class="set-shot" data-reveal>
            <img src="/images/automotive/portrait-porsche-profile-1440.jpg" width="1440" height="1800" alt="Full side profile of a silver Porsche 911 inside a private automotive gallery." loading="lazy" decoding="async">
          </figure>
          <figure class="set-shot" data-reveal>
            <img src="/images/automotive/portrait-ferrari-wheels-1440.jpg" width="1440" height="1800" alt="Matte gray Ferrari photographed beneath a wall display of wheels." loading="lazy" decoding="async">
          </figure>
          <figure class="set-shot" data-reveal>
            <img src="/images/automotive/portrait-ferrari-pair-1440.jpg" width="1440" height="1800" alt="Two Ferrari sports cars photographed in a dim private collection." loading="lazy" decoding="async">
          </figure>
        </div>
      </article>

      <article class="photo-set" data-photo-set aria-labelledby="spaces-title">
        <header class="set-heading" data-reveal><h2 id="spaces-title">SPACES</h2></header>
        <div class="set-gallery">
          <figure class="set-shot" data-reveal>
            <img src="/images/automotive/space-private-collection-1440.jpg" width="1440" height="1800" alt="Multilevel private automotive collection filled with classic cars and off-road vehicles." loading="lazy" decoding="async">
          </figure>
          <figure class="set-shot" data-reveal>
            <img src="/images/automotive/space-exotic-showroom-1440.jpg" width="1440" height="1800" alt="Red Lamborghini displayed beneath the Energetic Exotics showroom sign." loading="lazy" decoding="async">
          </figure>
          <figure class="set-shot" data-reveal>
            <img src="/images/automotive/space-tampa-night-1440.jpg" width="1440" height="2560" alt="Downtown Tampa skyline and a curving roadway photographed at night." loading="lazy" decoding="async">
          </figure>
          <figure class="set-shot" data-reveal>
            <img src="/images/automotive/space-architecture-1440.jpg" width="1440" height="2560" alt="Angular concrete columns and architectural lighting photographed at night." loading="lazy" decoding="async">
          </figure>
          <figure class="set-shot set-shot--wide" data-reveal>
            <img src="/images/automotive/space-stadium-1440.jpg" width="1440" height="754" alt="A stadium crowd surrounds an illuminated globe during a large production." loading="lazy" decoding="async">
          </figure>
        </div>
      </article>
    </section>
